<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command · Banda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css">
<style>
/* Hallmark · macrostructure: Workbench (sidebar dashboard) · tone: technical-dense · anchor hue: signal blue
 * theme: custom (command) · pre-emit critique: P4 H4 E4 S4 R4 V4 */
:root{
  --bg:oklch(15% .008 260);--surface:oklch(19% .01 260);--surface-2:oklch(23.5% .012 260);
  --text:oklch(94% .005 260);--muted:oklch(66% .015 260);--line:oklch(28% .012 260);
  --accent:oklch(72% .14 245);--accent-ink:oklch(15% .01 260);
  --danger:oklch(70% .17 25);--ok:oklch(76% .14 155);--warn:oklch(80% .14 80);--c2:oklch(73% .15 45);
  --radius:10px;--radius-s:6px;--gap:.85rem;--pad:1rem;--pad-view:1.1rem;--shadow:none;
  --font-body:"Geist",system-ui,sans-serif;--font-mono:"Geist Mono",ui-monospace,monospace;
  --h1:600 1.3rem/1.2 var(--font-body);--h2:500 .875rem/1.2 var(--font-body);--kpi-size:1.65rem;--kpi-weight:500;
}
:root[data-theme="light"]{
  --bg:oklch(97.5% .004 260);--surface:oklch(100% 0 0);--surface-2:oklch(95.5% .006 260);
  --text:oklch(20% .02 260);--muted:oklch(48% .02 260);--line:oklch(90% .008 260);
  --accent:oklch(52% .17 250);--accent-ink:oklch(99% 0 0);
  --danger:oklch(55% .2 27);--ok:oklch(50% .13 155);--warn:oklch(56% .15 70);--c2:oklch(62% .17 45);
}
.shell{display:grid;grid-template-columns:14.5rem minmax(0,1fr);height:100dvh}
.side{border-right:1px solid var(--line);padding:1rem .75rem;display:flex;flex-direction:column;gap:1.25rem;min-height:0}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;padding:.25rem .6rem;letter-spacing:-.01em}
.brand i{width:1.35rem;height:1.35rem;border-radius:5px;background:var(--accent);display:block}
.me{margin-top:auto;display:flex;gap:.6rem;align-items:center;padding:.6rem;border:1px solid var(--line);border-radius:var(--radius)}
.me div{display:grid;line-height:1.25}.me small{font-size:.75rem}
.top{display:flex;align-items:center;gap:.75rem;padding:.55rem 1.1rem;border-bottom:1px solid var(--line);min-height:3.2rem}
.crumb{color:var(--muted);white-space:nowrap}.crumb b{color:var(--text);font-weight:500}
.search{flex:1;max-width:28rem;margin-inline:auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:.35rem .7rem;color:var(--muted);font-size:.8125rem}
kbd{font:.6875rem var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:.05rem .35rem}
.kpi{padding:.85rem 1rem}.kpi .v{font-family:var(--font-mono)}
.kpi.main{border-color:color-mix(in oklch,var(--accent) 50%,var(--line))}
th{text-transform:none}
.card>header{padding-bottom:.4rem}
@media (max-width:1000px){
  .shell{display:block;height:auto}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:.6rem .75rem;overflow-x:auto}
  #nav{flex-direction:row}.me,.search{display:none}
  .top{padding:.5rem 1rem}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><i aria-hidden="true"></i>Banda</div>
    <nav id="nav" aria-label="Principal"></nav>
    <div class="me"><span class="avatar">CV</span><div><b>Carlos Vega</b><small>Lugarteniente</small></div></div>
  </aside>
  <div class="stage">
    <header class="top">
      <span class="crumb">Banda / <b id="crumb"></b></span>
      <span class="search" aria-hidden="true">Buscar o ir a… <kbd>Ctrl K</kbd></span>
      <span class="demo">datos de ejemplo</span>
      <button class="btn ghost sm" data-tema type="button">Tema</button>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<script src="dash.js"></script>
</body>
</html>
