<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daylight · Banda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dash.css">
<style>
/* Hallmark · macrostructure: Bento Grid (top-nav dashboard) · tone: soft-utilitarian · anchor hue: emerald
 * theme: custom (daylight) · pre-emit critique: P4 H4 E4 S4 R5 V4 */
:root{
  --bg:oklch(96.2% .01 95);--surface:oklch(99.4% .004 95);--surface-2:oklch(95% .01 95);
  --text:oklch(24% .025 165);--muted:oklch(52% .02 165);--line:oklch(91% .01 95);
  --accent:oklch(55% .12 163);--accent-ink:oklch(99% .005 95);
  --danger:oklch(57% .19 28);--ok:oklch(50% .13 155);--warn:oklch(60% .14 70);--c2:oklch(72% .13 70);
  --radius:18px;--radius-s:10px;--gap:1.1rem;--pad:1.3rem;--pad-view:1.5rem;
  --shadow:0 1px 2px oklch(25% .03 165 / .05),0 10px 28px oklch(25% .03 165 / .06);
  --font-body:"DM Sans",system-ui,sans-serif;--font-mono:"DM Mono",ui-monospace,monospace;
  --h1:700 1.9rem/1.1 var(--font-body);--h2:600 1rem/1.2 var(--font-body);--kpi-size:2.25rem;--kpi-weight:600;
}
:root[data-theme="dark"]{
  --bg:oklch(19% .012 165);--surface:oklch(23% .014 165);--surface-2:oklch(27% .016 165);
  --text:oklch(94% .01 95);--muted:oklch(70% .02 165);--line:oklch(31% .016 165);
  --accent:oklch(72% .14 160);--accent-ink:oklch(18% .02 165);
  --danger:oklch(70% .17 28);--ok:oklch(76% .14 155);--warn:oklch(80% .13 75);--c2:oklch(78% .12 75);
  --shadow:none;
}
.shell{display:flex;flex-direction:column;height:100dvh}
.topnav{display:flex;align-items:center;gap:1.5rem;padding:.8rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;font:700 1.15rem var(--font-body);white-space:nowrap;letter-spacing:-.02em}
.brand i{width:1.6rem;height:1.6rem;border-radius:50% 50% 50% 8px;background:var(--accent);display:block}
.topnav #nav{flex:1;flex-direction:row;gap:.25rem;justify-content:center;overflow-x:auto;scrollbar-width:none}
.topnav #nav a{border-radius:999px;padding:.5rem 1rem}
.topnav #nav a[aria-current]{background:color-mix(in oklch,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.topnav #nav a:hover{background:var(--surface-2)}
.tools{display:flex;align-items:center;gap:.7rem}
.kpi.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.kpi.main .l,.kpi.main .s{color:inherit;opacity:.85}
.kpi.main .ch-line{stroke:var(--accent-ink)}
.kpi .v{letter-spacing:-.03em}
.card>header{padding-bottom:.9rem}
.phead p{font-size:1rem}
@media (max-width:1000px){
  .shell{height:auto}
  .topnav{flex-wrap:wrap;gap:.6rem 1rem;padding:.7rem 1rem}
  .topnav #nav{order:3;flex-basis:100%;justify-content:flex-start}
  .demo{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topnav">
    <div class="brand"><i aria-hidden="true"></i>Banda</div>
    <nav id="nav" aria-label="Principal"></nav>
    <div class="tools"><span class="demo">datos de ejemplo</span><button class="btn ghost sm" data-tema type="button">Tema</button><span class="avatar" title="Carlos Vega">CV</span></div>
  </header>
  <div class="stage" style="flex:1">
    <main id="view" class="view"></main>
  </div>
</div>
<script src="dash.js"></script>
</body>
</html>
